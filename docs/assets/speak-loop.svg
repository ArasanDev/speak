<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">speak animated listening HUD</title>
  <desc id="desc">An animated amber voice meter with a coral recording light.</desc>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#292F38"/><stop offset="1" stop-color="#16181D"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="240" rx="24" fill="#0D0F13"/>
  <rect x="24" y="24" width="912" height="192" rx="18" fill="url(#glass)" stroke="#8A8F98" stroke-opacity="0.56"/>
  <circle cx="86" cy="120" r="9" fill="#FF5C49">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <g stroke="#FFB25A" stroke-width="12" stroke-linecap="round" filter="url(#soft)">
    <path d="M324 140V100"><animate attributeName="d" values="M324 140V100;M324 128V112;M324 140V100" dur="1.1s" repeatCount="indefinite"/></path>
    <path d="M378 160V80"><animate attributeName="d" values="M378 160V80;M378 132V108;M378 160V80" dur="0.9s" repeatCount="indefinite"/></path>
    <path d="M432 176V64"><animate attributeName="d" values="M432 176V64;M432 122V118;M432 176V64" dur="1.25s" repeatCount="indefinite"/></path>
    <path d="M486 150V90"><animate attributeName="d" values="M486 150V90;M486 132V108;M486 150V90" dur="0.8s" repeatCount="indefinite"/></path>
    <path d="M540 136V104"><animate attributeName="d" values="M540 136V104;M540 126V114;M540 136V104" dur="1s" repeatCount="indefinite"/></path>
  </g>
  <text x="650" y="126" fill="#8A8F98" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2">LISTENING</text>
</svg>
