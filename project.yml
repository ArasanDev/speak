# project.yml — XcodeGen project definition for `speak`.
#
# XcodeGen is BUILD-TIME tooling only (never linked into the shipped app), so it
# does not touch the "Apple-frameworks-only at runtime" moat (AGENTS.md §2.4).
# The generated Speak.xcodeproj is the canonical build system mandated by
# architecture.md §5: app target + SpeakCore.framework + SpeakTests.
#
# Regenerate with `xcodegen generate` (wired into `make build`). The .swift
# sources live in their final §5 folders and are assigned to targets here.

name: Speak

options:
  bundleIdPrefix: com.speak
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

# Code signing is defined in Signing.xcconfig (applied to every config below via
# `configFiles`), so BOTH `make build` and Xcode Cmd+R produce an identically-signed
# app. Default is ad-hoc; `make dev-cert` switches it to a stable self-signed identity
# so TCC permission grants persist across rebuilds. Do NOT re-add CODE_SIGN_* here —
# target-level settings override the xcconfig and would silently reinstate ad-hoc.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"            # Swift 5 language mode (compiler is 6.3.2)
    MACOSX_DEPLOYMENT_TARGET: "26.0"

targets:

  # SpeakLLM is the ONE sanctioned exception to "no networking symbols in
  # production source": the opt-in OpenAI-compatible cleanup engine (V01-2)
  # needs URLSession + Keychain (SecItem*) — both of which
  # scripts/verify-moat.sh and SpeakTests/MoatAuditTests.swift grep for in
  # SpeakCore/App/CLI to keep "100% local + offline, no account" a structural
  # guarantee. Isolating that code in its own target — outside those three
  # audited directories — keeps the audit's assertion honest (SpeakCore itself
  # has zero networking/Keychain symbols) while still allowing a real,
  # explicitly user-configured local-server/cloud cleanup engine to exist.
  # [decision V01-2 — see SpeakCore/Cleanup/OpenAICompatibleCleaner.swift]
  SpeakLLM:
    type: framework
    platform: macOS
    sources:
      - Speak/SpeakLLM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speak.SpeakLLM
        GENERATE_INFOPLIST_FILE: "YES"
        # Signing inherited from Signing.xcconfig (see configFiles above).

  SpeakCore:
    type: framework
    platform: macOS
    sources:
      - Speak/SpeakCore
    dependencies:
      - target: SpeakLLM
        embed: false   # Speak (the app) embeds SpeakLLM directly; SpeakCore only links it.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speak.SpeakCore
        GENERATE_INFOPLIST_FILE: "YES"
        # Signing inherited from Signing.xcconfig (see configFiles above).

  Speak:
    type: application
    platform: macOS
    sources:
      - Speak/App
    dependencies:
      - target: SpeakCore
        embed: true
      - target: SpeakLLM
        embed: true
    info:
      path: Speak/App/Info.generated.plist
      properties:
        LSUIElement: true            # menubar-only, no Dock icon
        CFBundleDisplayName: speak
        CFBundleName: speak
        CFBundleShortVersionString: "0.0.1"  # [decision: v0 early release, auto-detected in AboutView]
        CFBundleVersion: "1"                 # build counter — incremented per release
        NSMicrophoneUsageDescription: "speak transcribes your voice into text on-device. Audio is never uploaded or stored — it never leaves your Mac."
        NSSpeechRecognitionUsageDescription: "speak uses Apple on-device speech recognition to turn your dictation into text. All speech processing is 100% on-device and private."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speak.app
        # Signing inherited from Signing.xcconfig (see configFiles above).

  SpeakTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Speak/Tests/SpeakTests
    dependencies:
      - target: SpeakCore
      - target: SpeakLLM       # V01-2: OpenAICompatibleClient/LLMKeychainStore tests import this directly
        embed: false
      - target: Speak          # H2: TEST_HOST — gives tests access to the App shell
        embed: false           # test bundle embeds nothing; the host app carries it
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        # H2: host the Speak app so App-shell types (TranscriptOverlayPanel, AppDelegate…)
        # become unit-testable via @testable import Speak.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Speak.app/Contents/MacOS/Speak"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # CLI tool target — produces the `speak` binary that drives the running menubar app
  # via CFMessagePort IPC (Wave 2.3).
  #
  # Links SpeakCore for the shared CLIContract constants and codec types.
  # Does NOT embed the framework (it's a command-line tool, not a bundle);
  # the rpath points to DerivedData at build time.
  #
  # Install path (P11): the Homebrew cask symlinks this binary into PATH.
  # Standalone rpath (relative to @executable_path/../Frameworks or
  # /usr/local/lib/speak/) is set up in the P11 release target. [decision: W2.3]
  SpeakCLI:
    type: tool
    platform: macOS
    sources:
      - Speak/CLI
    dependencies:
      - target: SpeakCore
        embed: false
    settings:
      base:
        PRODUCT_NAME: speak
        PRODUCT_BUNDLE_IDENTIFIER: com.speak.cli
        GENERATE_INFOPLIST_FILE: "YES"
        # Use a distinct Swift module name to avoid the speak.swiftmodule artifact
        # colliding with Speak.swiftmodule (the app target) on the case-insensitive
        # APFS filesystem — both land in DerivedData/Build/Products/Debug/ and the
        # Swift module scanner would treat them as the same path. [decision: W2.3]
        SWIFT_MODULE_NAME: SpeakCLI
        # Signing inherited from Signing.xcconfig (see configFiles above).

  # MCP agent-bridge CLI target — produces the `speak-mcp` binary that serves
  # the Model Context Protocol over stdio for any MCP-capable agent
  # (specs/horizon-voice-os.md Pillar 3 / H-3 vertical slice).
  #
  # Links SpeakCore for the JSON-RPC/MCP protocol layer (SpeakCore/AgentBridge/)
  # and the existing CLIContract IPC types (reused unchanged by
  # CLIBridgeBackend to answer speak_status — no new transport in this slice).
  # Does NOT embed the framework — command-line tool, not a bundle; rpath
  # points to DerivedData at build time, same as SpeakCLI above.
  #
  # Transport: stdio only, no sockets. The XPC/socket link to the running
  # menubar app for a live speak_say/speak_ask/speak_confirm is a later task.
  SpeakMCP:
    type: tool
    platform: macOS
    sources:
      - Speak/MCP
    dependencies:
      - target: SpeakCore
        embed: false
    settings:
      base:
        PRODUCT_NAME: speak-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.speak.mcp
        GENERATE_INFOPLIST_FILE: "YES"
        # Distinct Swift module name — same APFS case-insensitivity rationale
        # as SpeakCLI's SWIFT_MODULE_NAME override above.
        SWIFT_MODULE_NAME: SpeakMCP
        # Signing inherited from Signing.xcconfig (see configFiles above).

schemes:
  Speak:
    build:
      targets:
        Speak: all
        SpeakCLI: all      # build the CLI tool on every `make build`
        SpeakMCP: all      # build the MCP agent-bridge shim on every `make build`
        SpeakTests: [test]
    test:
      targets:
        - SpeakTests
    run:
      config: Debug

  # Eval scheme — identical to Speak but bakes SPEAK_EVAL=1 into the test action
  # so the env var reaches the test host process (xcodebuild shell-prefix does not
  # propagate to the test host on macOS 26). Used by `make eval`. [decision: SM-2]
  Eval:
    build:
      targets:
        Speak: all
        SpeakTests: [test]
    test:
      targets:
        - SpeakTests
      environmentVariables:
        SPEAK_EVAL: "1"
