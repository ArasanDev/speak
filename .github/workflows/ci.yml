name: CI

# Release-time CI, not standing CI.
#
# speak is a local-first project: the developer's Mac is the only source of
# truth for validation (`make gates` locally). Nothing here runs on push —
# the full suite is triggered manually at release time via workflow_dispatch
# (Actions tab → CI → Run workflow), once the local gates are green.
#
# The one exception: moat-audit still runs on pull_request. External
# contributions can't be trusted to have run local gates, and the moat audit
# is the structural check that catches a PR adding cloud egress, telemetry,
# or a third-party dependency. It's a ~30s ubuntu job (free on public repos).
on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Always-reliable gate: a pure-shell source audit of the benchmark.md §3 BEAT
  # rows (no egress / account / third-party dep / paywall / pasteboard-read /
  # print). Needs no Xcode and no Apple SDK, so it runs on free Linux runners and
  # gives a trustworthy green check independent of Apple-runner availability.
  moat-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structural moat audit (no Xcode needed)
        run: make verify-moat

  # Full build/test/lint. Runs ONLY on manual dispatch — release-time
  # verification, not per-push. speak targets macOS 26 (Tahoe) + Xcode 26 and
  # imports FoundationModels + SpeechAnalyzer, which only exist on the macOS 26
  # SDK. GitHub's `macos-26` image ships Xcode 26; `macos-latest`/older images
  # fail with `no such module 'FoundationModels'`, so this job MUST pin macos-26.
  build-test-lint:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install build tooling
        run: brew install xcodegen swiftlint

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Lint
        run: make lint
