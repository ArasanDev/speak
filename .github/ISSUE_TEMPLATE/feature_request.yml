name: Feature request
description: Suggest an idea, engine, or improvement for speak.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: `docs/roadmap.md` and `docs/product.md` describe where
        the project is headed and why — a quick skim may save you writing up
        something already planned or already ruled out.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that speak doesn't support today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or tools you've tried.

  - type: checkboxes
    id: constraints
    attributes:
      label: Does this fit speak's hard constraints?
      description: "See AGENTS.md §2-3. speak is 100% local by design — features that require cloud services, telemetry, or accounts are out of scope for the core app."
      options:
        - label: This does not require sending audio, text, or telemetry off-device
        - label: This does not require a new third-party runtime dependency (v0 is Apple-frameworks-only)

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
